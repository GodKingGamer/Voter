<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#14171f;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--accent-soft:#dbe6ff;--bar:#9db4e6;--ok:#15803d;--warn:#b45309;--danger:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--ink:#eef0f5;--muted:#9aa3b2;--line:#2a3040;--accent:#6b9bff;--accent-soft:#1f2c4d;--bar:#3b4f7d;--ok:#4ade80;--warn:#fbbf24;--danger:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 0}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:clamp(22px,5vw,30px);margin:0 0 4px;letter-spacing:-.01em;word-break:break-word}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 14px;word-break:break-word}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-weight:800;color:var(--accent);text-decoration:none;font-size:15px;cursor:pointer;background:none;border:0;padding:6px 0;font-family:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:none;color:var(--muted);font-weight:600}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.block{width:100%}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;position:sticky;top:6px;z-index:5}
.tab{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 6px;border-radius:9px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.pill{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:99px;background:rgba(127,127,127,.25);font-size:13px}

.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.zoom{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:15px;cursor:zoom-in;display:grid;place-items:center;padding:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
.bar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .cnt{flex:1;font-weight:600}

.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.rrow{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.link{display:flex;gap:8px}
.link input{flex:1;min-width:0}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.pitem b{display:block;word-break:break-word}
.pitem small{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;word-break:break-word}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:50;padding:16px}
.lb.on{display:grid}
.lb figure{margin:0;max-width:min(92vw,560px);color:#fff;text-align:center}
.lb img{width:100%;border-radius:12px;display:block}
.lb figcaption{margin-top:8px;font-weight:600}
.ver{margin:28px 0 8px;text-align:center;color:var(--muted);font-size:12px;display:grid;gap:6px;justify-items:center}
.ver p{margin:0}
.linkbtn{font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-size:14px}
.skel{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="lb" id="lb"><figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure></div>
<div id="toast" class="toast" role="status" hidden><span>Đã có bản mới.</span> <button id="toast-reload" class="btn sm" type="button">Tải lại</button></div>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* =============== Tiện ích =============== */
var $=function(s,r){return (r||document).querySelector(s)};
function h(tag,attrs){
  var e=document.createElement(tag),a=attrs||{};
  Object.keys(a).forEach(function(k){
    var v=a[k];if(v==null||(v===false&&k.indexOf("aria-")!==0))return;
    if(k==="class")e.className=v;
    else if(k==="text")e.textContent=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(k==="value"||k==="checked"||k==="disabled")e[k]=v;
    else e.setAttribute(k,(v===true&&k.indexOf("aria-")!==0)?"":String(v));
  });
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(p,c){
  if(c==null||c===false)return;
  if(Array.isArray(c))c.forEach(function(x){add(p,x)});
  else p.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));
}
function rid(n){var a=new Uint8Array(n),s="";(crypto.getRandomValues?crypto.getRandomValues(a):a.forEach(function(_,i){a[i]=Math.random()*256}));for(var i=0;i<n;i++)s+="abcdefghijklmnopqrstuvwxyz0123456789"[a[i]%36];return s}
function nameKey(n){
  var k=String(n).toLowerCase();
  if(k.normalize)k=k.normalize("NFD").replace(/[̀-ͯ]/g,"");
  k=k.replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80);
  if(k.length<2)k=Array.from(String(n)).map(function(c){return c.codePointAt(0).toString(16)}).join("-").slice(0,80);
  return k;
}
function cleanName(s){return String(s||"").replace(/\s+/g," ").trim().slice(0,60)}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function copyText(t){
  return new Promise(function(res){
    function fb(){try{var ta=h("textarea",{value:t,style:"position:fixed;opacity:0"});document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");ta.remove();res(ok)}catch(e){res(false)}}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){res(true)},fb);else fb();
  });
}
function pollUrl(pid){return location.origin+location.pathname+"#p="+pid}
var S={be:null,uid:null,err:null,view:"home",pid:null,poll:undefined,imgs:null,votes:null,device:undefined,tab:"vote",sel:{},name:"",msg:null,unsubs:[],mine:null,draft:null,barsShown:false,busy:false,armed:null,installEv:null};
S.sel=new Set();

/* =============== Lightbox =============== */
function zoom(src,cap){$("#lb-img").src=src;$("#lb-cap").textContent=cap||"";$("#lb").classList.add("on")}
$("#lb").onclick=function(){$("#lb").classList.remove("on")};
document.addEventListener("keydown",function(e){if(e.key==="Escape")$("#lb").classList.remove("on")});

/* =============== Kho dữ liệu: Firestore =============== */
function firestoreBackend(db,uid){
  var polls=db.collection("polls");
  function P(pid){return polls.doc(pid)}
  return {
    kind:"firestore",
    getPoll:function(pid){return P(pid).get().then(function(s){return s.exists?Object.assign({id:pid},s.data()):null})},
    onPoll:function(pid,cb,er){return P(pid).onSnapshot(function(s){cb(s.exists?Object.assign({id:pid},s.data()):null)},er)},
    listMine:function(){return polls.where("ownerId","==",uid).get().then(function(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})})},
    createPoll:function(pid,poll,imgs){
      var b=db.batch();b.set(P(pid),poll);
      Object.keys(imgs).forEach(function(o){b.set(P(pid).collection("imgs").doc(o),{data:imgs[o]})});
      return b.commit();
    },
    updatePoll:function(pid,patch){return P(pid).update(patch)},
    getImages:function(pid){return P(pid).collection("imgs").get().then(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data().data});return m})},
    onVotes:function(pid,cb,er){return P(pid).collection("votes").onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({key:d.id},d.data())}))},er)},
    getDevice:function(pid){return P(pid).collection("devices").doc(uid).get().then(function(s){return s.exists?s.data():null})},
    submitVote:function(pid,key,vote){
      var b=db.batch();
      b.set(P(pid).collection("votes").doc(key),Object.assign({uid:uid},vote));
      b.set(P(pid).collection("devices").doc(uid),{key:key,at:vote.at});
      return b.commit().then(function(){return{ok:true}},function(e){
        return P(pid).collection("votes").doc(key).get().then(function(s){
          if(s.exists)return{ok:false,error:"name_taken"};
          return P(pid).collection("devices").doc(uid).get().then(function(d){return{ok:false,error:d.exists?"device":"denied"}});
        },function(){return{ok:false,error:"denied"}});
      });
    },
    deleteVote:function(pid,key){return P(pid).collection("votes").doc(key).delete()},
    clearVotes:function(pid){return wipe(P(pid),["votes","devices"])},
    deletePoll:function(pid){return wipe(P(pid),["votes","devices","imgs"]).then(function(){return P(pid).delete()})}
  };
  function wipe(ref,subs){
    return subs.reduce(function(pr,sub){
      return pr.then(function(){return ref.collection(sub).get()}).then(function(s){
        var docs=s.docs,i=0,chain=Promise.resolve();
        while(i<docs.length){(function(part){chain=chain.then(function(){var b=db.batch();part.forEach(function(d){b.delete(d.ref)});return b.commit()})})(docs.slice(i,i+400));i+=400}
        return chain;
      });
    },Promise.resolve());
  }
}

/* =============== Kho dữ liệu: bộ nhớ (chỉ dùng khi thử nghiệm / mất kết nối cấu hình) =============== */
function memoryBackend(){
  var KEY="bc_mem_v1",uid=(function(){var u=null;try{u=sessionStorage.getItem("bc_uid")}catch(e){}if(!u){u="mem"+rid(8);try{sessionStorage.setItem("bc_uid",u)}catch(e){}}return u})();
  var subs=[];
  function load(){return lsGet(KEY,{polls:{}})}
  function save(d){lsSet(KEY,d);subs.slice().forEach(function(f){f()})}
  window.addEventListener("storage",function(e){if(e.key===KEY)subs.slice().forEach(function(f){f()})});
  function listen(fn){subs.push(fn);fn();return function(){subs=subs.filter(function(x){return x!==fn})}}
  function pub(p){var c=Object.assign({},p);delete c._votes;delete c._devices;delete c._imgs;return c}
  var be={
    kind:"memory",uid:uid,
    getPoll:function(pid){var p=load().polls[pid];return Promise.resolve(p?Object.assign({id:pid},pub(p)):null)},
    onPoll:function(pid,cb){return listen(function(){var p=load().polls[pid];cb(p?Object.assign({id:pid},pub(p)):null)})},
    listMine:function(){var d=load();return Promise.resolve(Object.keys(d.polls).filter(function(k){return d.polls[k].ownerId===uid}).map(function(k){return Object.assign({id:k},pub(d.polls[k]))}))},
    createPoll:function(pid,poll,imgs){var d=load();d.polls[pid]=Object.assign({},poll,{_votes:{},_devices:{},_imgs:imgs});save(d);return Promise.resolve()},
    updatePoll:function(pid,patch){var d=load();Object.assign(d.polls[pid],patch);save(d);return Promise.resolve()},
    getImages:function(pid){return Promise.resolve(load().polls[pid]._imgs||{})},
    onVotes:function(pid,cb){return listen(function(){var p=load().polls[pid];cb(p?Object.keys(p._votes).map(function(k){return Object.assign({key:k},p._votes[k])}):[])})},
    getDevice:function(pid){var p=load().polls[pid];return Promise.resolve(p&&p._devices[uid]||null)},
    submitVote:function(pid,key,vote){var d=load(),p=d.polls[pid];
      if(p.closed)return Promise.resolve({ok:false,error:"denied"});
      if(p._votes[key])return Promise.resolve({ok:false,error:"name_taken"});
      if(p._devices[uid])return Promise.resolve({ok:false,error:"device"});
      p._votes[key]=Object.assign({uid:uid},vote);p._devices[uid]={key:key,at:vote.at};save(d);return Promise.resolve({ok:true})},
    deleteVote:function(pid,key){var d=load();delete d.polls[pid]._votes[key];save(d);return Promise.resolve()},
    clearVotes:function(pid){var d=load();d.polls[pid]._votes={};d.polls[pid]._devices={};save(d);return Promise.resolve()},
    deletePoll:function(pid){var d=load();delete d.polls[pid];save(d);return Promise.resolve()}
  };
  return be;
}

/* =============== Kết nối =============== */
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement("script");s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function connect(){
  if(window.BINHCHON_FORCE_MEMORY){S.be=memoryBackend();S.uid=S.be.uid;return}
  var cfg=window.BINHCHON_FIREBASE;
  if(!cfg||!cfg.apiKey)throw new Error("config");
  var b="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/";
  await loadScript(b+"firebase-app-compat.min.js");
  await Promise.all([loadScript(b+"firebase-auth-compat.min.js"),loadScript(b+"firebase-firestore-compat.min.js")]);
  firebase.initializeApp(cfg);
  var auth=firebase.auth();
  await new Promise(function(res){var u=auth.onAuthStateChanged(function(){u();res()})});
  if(!auth.currentUser)await auth.signInAnonymously();
  S.uid=auth.currentUser.uid;
  S.be=firestoreBackend(firebase.firestore(),S.uid);
}

/* =============== Điều hướng =============== */
function cleanup(){S.unsubs.forEach(function(f){try{f()}catch(e){}});S.unsubs=[]}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){
  if(!S.be)return;
  cleanup();S.msg=null;S.armed=null;
  var m=location.hash.match(/^#p=([a-z0-9]{6,20})$/);
  if(m)return openPoll(m[1]);
  if(location.hash==="#new")return openCreate();
  return openHome();
}
window.addEventListener("hashchange",route);

/* =============== Màn hình chính =============== */
function openHome(){
  S.view="home";S.mine=null;render();
  var saved=lsGet("bc_mine",[]);
  if(S.be)S.be.listMine().then(function(list){
    var ids={};list.forEach(function(p){ids[p.id]=1});
    saved.forEach(function(s){if(!ids[s.id])list.push({id:s.id,title:s.title,createdAt:s.createdAt,_cached:true})});
    list.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
    S.mine=list;if(S.view==="home")render();
  },function(){S.mine=saved;if(S.view==="home")render()});
}
function viewHome(){
  return [

      h("div",{class:"stat"},h("b",{style:"font-size:17px;word-break:break-word",text:lead.length?lead.join(" & "):"–"}),h("span",{text:"đang dẫn đầu"}))),
    h("div",{class:"res"},rows),

}
function viewManage(t){
  var p=S.poll,url=pollUrl(p.id);
  function two(id,label,doIt){
    return h("button",{class:"btn danger sm",onclick:function(){
      if(S.armed!==id){S.armed=id;render();return}
      S.armed=null;doIt();
    },text:S.armed===id?"Bấm lần nữa để xác nhận":label});
  }

      h("td",null,h("button",{class:"btn ghost sm",title:"Xóa phiếu này",onclick:function(){S.be.deleteVote(S.pid,v.key).catch(function(){S.msg={t:"err",m:"Không xóa được phiếu."};render()})},text:"Xóa"})));
  });
  return h("div",null,
    h("div",{class:"card"},h("h2",{text:"Gửi link cho mọi người"}),
      h("div",{class:"link"},h("input",{type:"text",readonly:true,value:url,"aria-label":"Link bình chọn",onfocus:function(e){e.target.select()}}),
        h("button",{class:"btn",id:"copy",onclick:function(e){var b=e.target;copyText(url).then(function(ok){b.textContent=ok?"Đã chép ✓":"Chép thủ công";setTimeout(function(){b.textContent="Chép link"},2000)})},text:"Chép link"})),
      navigator.share?h("button",{class:"btn sec sm",style:"margin-top:10px",onclick:function(){navigator.share({title:p.title,url:url}).catch(function(){})},text:"Chia sẻ…"}):null),
    h("div",{class:"card"},h("h2",{text:"Điều khiển"}),
      h("div",{class:"row2"},
        h("button",{class:"btn sec sm",id:"toggle",onclick:function(){S.be.updatePoll(S.pid,{closed:!p.closed}).catch(function(){S.msg={t:"err",m:"Không cập nhật được."};render()})},text:p.closed?"Mở lại bình chọn":"Đóng bình chọn"}),
        h("button",{class:"btn sec sm",onclick:function(){
          var lines=[p.title,""].concat(p.options.map(function(o){return {l:o.label,c:t.c[o.id]}}).sort(function(a,b){return b.c-a.c}).map(function(x,i){return (i+1)+". "+x.l+": "+x.c+" phiếu"+(t.voters?" ("+Math.round(x.c/t.voters*100)+"%)":"")}),["","Tổng: "+t.voters+" người bình chọn"]);
          copyText(lines.join("\n")).then(function(ok){S.msg={t:ok?"ok":"warn",m:ok?"Đã chép kết quả dạng văn bản.":"Không chép được."};render()});
        },text:"Chép kết quả (văn bản)"})),
      h("div",{class:"row2",style:"margin-top:12px"},
        two("clear","Xóa toàn bộ phiếu",function(){S.be.clearVotes(S.pid).then(function(){S.msg={t:"ok",m:"Đã xóa toàn bộ phiếu."};render()},function(){S.msg={t:"err",m:"Không xóa được."};render()})}),
        two("del","Xóa cuộc bình chọn",function(){S.be.deletePoll(S.pid).then(function(){var m=lsGet("bc_mine",[]).filter(function(x){return x.id!==S.pid});lsSet("bc_mine",m);go("#")},function(){S.msg={t:"err",m:"Không xóa được."};render()})}))),
    h("div",{class:"card"},h("h2",{text:"Danh sách người đã bình chọn ("+(S.votes||[]).length+")"}),

      h("p",{class:"sub",style:"font-size:12px;margin:8px 0 0",text:"Chỉ bạn (người tạo, trên trình duyệt này) thấy mục Quản lý. Nếu xóa dữ liệu trình duyệt, bạn sẽ mất quyền quản lý."})));
}

/* =============== Vẽ lại =============== */
function render(){
  var app=$("#app"),ae=document.activeElement,keep=ae&&ae.id&&app.contains(ae)?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  var y=window.scrollY;
  app.textContent="";
  if(S.err){add(app,[h("h1",{text:"Chưa kết nối được máy chủ"}),h("p",{class:"sub",text:"Kiểm tra mạng rồi tải lại trang."}),h("button",{class:"btn",onclick:function(){location.reload()},text:"Tải lại"})]);return}
  if(!S.be){add(app,[h("div",{class:"top"},h("span",{class:"brand",text:"Bình chọn nhanh"})),h("div",{class:"skel"})]);return}
  var v=S.view==="home"?viewHome():S.view==="create"?viewCreate():viewPoll();
  add(app,v);
  if(keep){var el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
  window.scrollTo(0,y);
}
document.addEventListener("dragover",function(e){
  if(!hasFiles(e))return;e.preventDefault();
  var c=document.getElementById("optcard");if(c&&S.view==="create")c.classList.add("dz");
});
document.addEventListener("dragleave",function(e){
  if(e.relatedTarget)return;var c=document.getElementById("optcard");if(c)c.classList.remove("dz");
});
document.addEventListener("drop",function(e){
  if(!hasFiles(e))return;e.preventDefault();
  var c=document.getElementById("optcard");if(c)c.classList.remove("dz");
  if(S.view==="create")addImageFiles(e.dataTransfer.files);
});
document.addEventListener("paste",function(e){
  if(S.view!=="create"||!e.clipboardData)return;
  var fs=Array.from(e.clipboardData.files||[]).filter(isImg);
  if(!fs.length)return;e.preventDefault();addImageFiles(fs);
});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();S.installEv=e;if(S.be&&S.view==="home")render()});

/* =============== Khởi động =============== */
render();
connect().then(function(){route()},function(){S.err=true;render()});

if("serviceWorker" in navigator&&!window.BINHCHON_FORCE_MEMORY){
  var had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(function(r){setInterval(function(){r.update().catch(function(){})},3600000)}).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!had){had=true;return}
    var t=document.getElementById("toast");t.hidden=false;
    document.getElementById("toast-reload").onclick=function(){location.reload()};
  });
}
})();
